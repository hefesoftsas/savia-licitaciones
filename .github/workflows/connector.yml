name: Transferir instaladores verificados
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Instaladores a transferir
        required: true
        type: choice
        options:
          - linux-and-macos
          - windows
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Transferir instaladores de la compilación verificada
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          case "$RELEASE_PLATFORM" in
            linux-and-macos) names=(savia-connector-darwin-arm64 savia-connector-darwin-x64 savia-connector-linux-arm64) ;;
            windows) names=(savia-connector-win32-x64) ;;
          esac
          for name in "${names[@]}"; do
            gh run download 45062019026 --repo "$repo" --name "$name" --dir "$RUNNER_TEMP/$name"
            file="$(find "$RUNNER_TEMP/$name" -maxdepth 2 -type f -print -quit)"
            test -n "$file"
            label="$(basename "$file")"
            case "$label" in Savia-Conector-0.1.3-*) ;; *) exit 1 ;; esac
            if ! gh release view connector-v0.1.3 --repo "$repo" --json assets --jq '.assets[] | select(.state=="uploaded") | .name' | grep -Fxq "$label"; then
              gh release upload connector-v0.1.3 --repo "$repo" "$file"
            fi
          done
