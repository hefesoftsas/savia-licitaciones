name: Savia web CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Web, suite: web }
          - { name: API 1 of 8, suite: api, shard: '1/8' }
          - { name: API 2 of 8, suite: api, shard: '2/8' }
          - { name: API 3 of 8, suite: api, shard: '3/8' }
          - { name: API 4 of 8, suite: api, shard: '4/8' }
          - { name: API 5 of 8, suite: api, shard: '5/8' }
          - { name: API 6 of 8, suite: api, shard: '6/8' }
          - { name: API 7 of 8, suite: api, shard: '7/8' }
          - { name: API 8 of 8, suite: api, shard: '8/8' }
          - { name: Runner, suite: runner }
          - { name: Connector, suite: connector }
          - { name: Maintenance, suite: maintenance }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'pnpm'
      - uses: actions/setup-dotnet@v4
        if: matrix.suite == 'api' || matrix.suite == 'runner'
        with:
          dotnet-version: '10.0.x'
      - name: Install verified dependencies
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.suite }}" != "connector" ]; then
            EXTRA_FLAGS="--no-optional"
          fi
          for attempt in 1 2 3; do
            if node scripts/install-dependencies.mjs $EXTRA_FLAGS; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency verification failed; retrying ($attempt/3)."
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Prepare Word helper
        if: matrix.suite == 'api' || matrix.suite == 'runner'
        run: node client/scripts/prepare-openxml-helper.cjs --platform linux --arch x64
      - name: Build web assets for API tests
        if: matrix.suite == 'api'
        run: pnpm run build:web
      - name: Typecheck client
        if: matrix.suite == 'web'
        run: pnpm run typecheck
      - name: Test client
        if: matrix.suite == 'web'
        run: pnpm run test:client
      - name: Build web and verify assets
        if: matrix.suite == 'web'
        run: pnpm run test:web-assets
      - name: Upload built web assets for deploy
        if: matrix.suite == 'web' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-api/dist
          if-no-files-found: error
          retention-days: 1
      - name: Test web API
        if: matrix.suite == 'api'
        working-directory: web-api
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node --test --test-concurrency=2 --test-shard="$TEST_SHARD" test/*.test.mjs
      - name: Test runner
        if: matrix.suite == 'runner'
        run: |
          pnpm run test:runner
          node --test client/scripts/savia-markup-word.test.cjs
      - name: Test connector
        if: matrix.suite == 'connector'
        run: node --test connector/test/*.test.*
      - name: Test scripts
        if: matrix.suite == 'maintenance'
        run: pnpm run test:scripts
      - name: Test infra D1 restore
        if: matrix.suite == 'maintenance'
        working-directory: infra/web
        run: python3 -m unittest test_d1_restore.py

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'pnpm'

      - name: Install verified dependencies
        run: |
          for attempt in 1 2 3; do
            if node scripts/install-dependencies.mjs --no-optional; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency verification failed; retrying ($attempt/3)."
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Download built web assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-api/dist

      - name: Generate Wrangler deploy config
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          CREDENTIAL_KEY_ID: ${{ vars.CREDENTIAL_KEY_ID }}
          RUNNER_DOWNLOAD_WINDOWS_URL: ${{ vars.RUNNER_DOWNLOAD_WINDOWS_URL }}
          RUNNER_DOWNLOAD_MACOS_X64_URL: ${{ vars.RUNNER_DOWNLOAD_MACOS_X64_URL }}
          RUNNER_DOWNLOAD_MACOS_ARM64_URL: ${{ vars.RUNNER_DOWNLOAD_MACOS_ARM64_URL }}
          RUNNER_DOWNLOAD_LINUX_ARM64_URL: ${{ vars.RUNNER_DOWNLOAD_LINUX_ARM64_URL }}
        run: |
          node --input-type=module << 'EOF'
          import fs from 'node:fs';

          const required = [
            'WORKER_NAME',
            'D1_DATABASE_NAME',
            'D1_DATABASE_ID',
            'R2_BUCKET_NAME',
            'BETTER_AUTH_URL',
            'AUTH_EMAIL_FROM',
            'CREDENTIAL_KEY_ID',
          ];
          for (const key of required) {
            if (!process.env[key]) {
              throw new Error(`Missing required repository variable or secret: ${key}`);
            }
          }

          const template = JSON.parse(fs.readFileSync('web-api/wrangler.web.template.jsonc', 'utf8'));
          const config = {
            ...template,
            name: process.env.WORKER_NAME,
            account_id: process.env.CLOUDFLARE_ACCOUNT_ID,
            r2_buckets: [{ binding: 'FILES', bucket_name: process.env.R2_BUCKET_NAME }],
            d1_databases: [
              {
                binding: 'DB',
                database_name: process.env.D1_DATABASE_NAME,
                database_id: process.env.D1_DATABASE_ID,
                migrations_dir: 'migrations',
              },
            ],
            vars: {
              ...template.vars,
              BETTER_AUTH_URL: process.env.BETTER_AUTH_URL,
              AUTH_EMAIL_FROM: process.env.AUTH_EMAIL_FROM,
              CREDENTIAL_KEY_ID: process.env.CREDENTIAL_KEY_ID,
              RUNNER_DOWNLOAD_WINDOWS_URL: process.env.RUNNER_DOWNLOAD_WINDOWS_URL ?? '',
              RUNNER_DOWNLOAD_MACOS_X64_URL: process.env.RUNNER_DOWNLOAD_MACOS_X64_URL ?? '',
              RUNNER_DOWNLOAD_MACOS_ARM64_URL: process.env.RUNNER_DOWNLOAD_MACOS_ARM64_URL ?? '',
              RUNNER_DOWNLOAD_LINUX_ARM64_URL: process.env.RUNNER_DOWNLOAD_LINUX_ARM64_URL ?? '',
            },
            send_email: [
              {
                name: 'EMAIL',
                allowed_sender_addresses: [process.env.AUTH_EMAIL_FROM],
              },
            ],
          };

          fs.writeFileSync('web-api/wrangler.web.deploy.json', JSON.stringify(config, null, 2));
          EOF

      - name: Apply D1 migrations
        working-directory: web-api
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.web.deploy.json

      - name: Deploy Worker and assets
        working-directory: web-api
        run: ./node_modules/.bin/wrangler deploy --config wrangler.web.deploy.json

      - name: Remove generated deploy config
        if: always()
        run: rm -f web-api/wrangler.web.deploy.json
